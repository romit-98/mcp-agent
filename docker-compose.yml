services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: northstar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp-crm:
    build:
      context: .  # repo root, so the image can include libs/northstar-common
      dockerfile: services/mcp-crm/Dockerfile
    image: northstar/mcp-crm:dev
    container_name: northstar-mcp-crm
    environment:
      CRM_DB_HOST: postgres  # the compose service name, on the internal network
      CRM_DB_PORT: 5432      # the container port, not the 5433 host port
      CRM_DB_NAME: ${POSTGRES_DB:-northstar}
      CRM_DB_USER: ${CRM_DB_USER:?Set CRM_DB_USER in .env}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD in .env}
      CRM_DEV_AUTH: ${CRM_DEV_AUTH:-false}
      CRM_OIDC_ISSUER: http://localhost:8180/realms/northstar  # the token's iss
      CRM_OIDC_JWKS_URL: http://keycloak:8080/realms/northstar/protocol/openid-connect/certs  # keys fetched on the internal network
    ports:
      # Localhost only: until phase 5, anyone who can reach this port can claim any identity.
      - "127.0.0.1:${CRM_HOST_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-finance:
    build:
      context: .
      dockerfile: services/mcp-finance/Dockerfile
    image: northstar/mcp-finance:dev
    container_name: northstar-mcp-finance
    environment:
      FIN_DB_HOST: postgres
      FIN_DB_PORT: 5432
      FIN_DB_NAME: ${POSTGRES_DB:-northstar}
      FIN_DB_USER: ${FIN_DB_USER:?Set FIN_DB_USER in .env}
      FIN_DB_PASSWORD: ${FIN_DB_PASSWORD:?Set FIN_DB_PASSWORD in .env}
      FIN_DEV_AUTH: ${FIN_DEV_AUTH:-false}
      FIN_OIDC_ISSUER: http://localhost:8180/realms/northstar  # the token's iss
      FIN_OIDC_JWKS_URL: http://keycloak:8080/realms/northstar/protocol/openid-connect/certs  # keys fetched on the internal network
    ports:
      - "127.0.0.1:${FIN_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-email:
    build:
      context: .
      dockerfile: services/mcp-email/Dockerfile
    image: northstar/mcp-email:dev
    container_name: northstar-mcp-email
    environment:
      EMAIL_DB_HOST: postgres
      EMAIL_DB_PORT: 5432
      EMAIL_DB_NAME: ${POSTGRES_DB:-northstar}
      EMAIL_DB_USER: ${EMAIL_DB_USER:?Set EMAIL_DB_USER in .env}
      EMAIL_DB_PASSWORD: ${EMAIL_DB_PASSWORD:?Set EMAIL_DB_PASSWORD in .env}
      EMAIL_DEV_AUTH: ${EMAIL_DEV_AUTH:-false}
      EMAIL_OIDC_ISSUER: http://localhost:8180/realms/northstar  # the token's iss
      EMAIL_OIDC_JWKS_URL: http://keycloak:8080/realms/northstar/protocol/openid-connect/certs  # keys fetched on the internal network
    ports:
      - "127.0.0.1:${EMAIL_HOST_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-knowledge:
    build:
      context: .
      dockerfile: services/mcp-knowledge/Dockerfile
    image: northstar/mcp-knowledge:dev
    container_name: northstar-mcp-knowledge
    environment:
      KNOW_DB_HOST: postgres
      KNOW_DB_PORT: 5432
      KNOW_DB_NAME: ${POSTGRES_DB:-northstar}
      KNOW_DB_USER: ${KNOW_DB_USER:?Set KNOW_DB_USER in .env}
      KNOW_DB_PASSWORD: ${KNOW_DB_PASSWORD:?Set KNOW_DB_PASSWORD in .env}
      KNOW_DEV_AUTH: ${KNOW_DEV_AUTH:-false}
      KNOW_OIDC_ISSUER: http://localhost:8180/realms/northstar  # the token's iss
      KNOW_OIDC_JWKS_URL: http://keycloak:8080/realms/northstar/protocol/openid-connect/certs  # keys fetched on the internal network
    ports:
      - "127.0.0.1:${KNOW_HOST_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: northstar-keycloak
    # Dev mode; the realm is imported on first start. Tokens always carry the public issuer
    # (http://localhost:8180) even when other containers call it at http://keycloak:8080.
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8180
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      # Substituted into keycloak/import/northstar-realm.json at import time.
      KC_AGENT_CLIENT_SECRET: ${KC_AGENT_CLIENT_SECRET:?Set KC_AGENT_CLIENT_SECRET in .env}
      KC_GATEWAY_CLIENT_SECRET: ${KC_GATEWAY_CLIENT_SECRET:?Set KC_GATEWAY_CLIENT_SECRET in .env}
      KC_DEV_USER_PASSWORD: ${KC_DEV_USER_PASSWORD:?Set KC_DEV_USER_PASSWORD in .env}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image has no curl; ask the management port's readiness endpoint over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # INSECURE BASELINE (phase 4): no access control by design. Only started on request:
  #   docker compose --profile baseline up -d mcp-insecure
  mcp-insecure:
    profiles: ["baseline"]
    build:
      context: .
      dockerfile: services/mcp-insecure/Dockerfile
    image: northstar/mcp-insecure:dev
    container_name: northstar-mcp-insecure
    environment:
      INSECURE_DB_HOST: postgres
      INSECURE_DB_PORT: 5432
      INSECURE_DB_NAME: ${POSTGRES_DB:-northstar}
      INSECURE_DB_USER: ${INSECURE_DB_USER:?Set INSECURE_DB_USER in .env}
      INSECURE_DB_PASSWORD: ${INSECURE_DB_PASSWORD:?Set INSECURE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${INSECURE_HOST_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
