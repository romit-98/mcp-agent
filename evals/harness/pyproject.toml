[project]
name = "northstar-evals"
version = "0.1.0"
description = "Runs the S1-S6 scenarios against the agent and detects leaks and unsafe actions"
requires-python = ">=3.12"
dependencies = [
    "northstar-agent",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
northstar-agent = { path = "../../services/agent", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals_harness"]
