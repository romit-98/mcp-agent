[project]
name = "northstar-common"
version = "0.1.0"
description = "Identity, errors, settings and database helpers shared by the Northstar MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
