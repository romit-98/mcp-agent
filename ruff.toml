# Shared lint config for every service (ruff finds the nearest ruff.toml).
line-length = 100
target-version = "py312"
src = ["services/*/src", "libs/*/src"]  # so our own packages sort as first-party

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # likely bugs
    "UP",      # modern syntax
    "S",       # security (bandit)
    "ISC",     # implicit string concatenation
]

[lint.per-file-ignores]
"evals/harness/src/evals_harness/report.py" = ["E501"]  # markdown table rows read better unwrapped
"**/tests/**" = [
    "S101",  # assert is how pytest works
    "S608",  # ground-truth queries in tests compose SQL from test constants
]
