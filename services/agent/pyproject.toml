[project]
name = "northstar-agent"
version = "0.1.0"
description = "LangGraph agent that calls the Northstar MCP tools as a given user"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14,<3",
    "langchain-anthropic>=1.7,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langgraph>=1.2,<2",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pyjwt[crypto]>=2.10,<3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
