[project]
name = "northstar-mcp-insecure"
version = "0.1.0"
description = "INSECURE BASELINE ONLY: all 8 Northstar tools with no access control (phase 4)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "northstar-common",
    "northstar-mcp-knowledge",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.16,<3",
]

[tool.uv.sources]
northstar-common = { path = "../../libs/northstar-common", editable = true }
northstar-mcp-knowledge = { path = "../mcp-knowledge", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_insecure"]
