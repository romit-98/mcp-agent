[project]
name = "northstar-mcp-knowledge"
version = "0.1.0"
description = "Knowledge MCP server (permission-aware hybrid search) for Northstar Logistics"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7,<1",
    "mcp[cli]>=2.3,<3",
    "northstar-common",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.16,<3",
]

[tool.uv.sources]
northstar-common = { path = "../../libs/northstar-common", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
